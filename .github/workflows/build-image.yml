# Builds the nodejs26.x mainline runtime image for arm64 on a CodeBuild-hosted runner and runs the
# smoke and security tests through the Runtime Interface Emulator. On a push it also pushes the image to ECR,
# tagged <commit>-arm64, as the role that the deploy environment's OIDC token may assume.
#
# The CodeBuild label names the runner project; the extra labels override its instance size.
# Repository variables:
#   REGISTRY_MIRROR  optional: an ECR pull-through cache of public.ecr.aws for the builder and
#                    base images (see build.sh). The runner's CodeBuild role pulls from it.
name: Build runtime image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  ECR_REPOSITORY: aws-lambda-nodejs-runtime

jobs:
  build-arm64:
    runs-on:
      - codebuild-project-aws-aws-lambda-nodejs-runtime-arm64-${{ github.run_id }}-${{ github.run_attempt }}
      - instance-size:2xlarge
    timeout-minutes: 120
    environment: ${{ github.event_name == 'push' && 'deploy' || '' }}
    env:
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # build.sh writes to the containerd image store and later builds read those images back
      # as build contexts, which the classic image store cannot do.
      - name: Use the containerd image store
        run: |
          if docker info -f '{{ .DriverStatus }}' | grep -q io.containerd.snapshotter; then exit 0; fi
          mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' > /etc/docker/daemon.json
          pkill dockerd || true
          while pgrep -x dockerd > /dev/null; do sleep 1; done
          nohup dockerd > /tmp/dockerd.log 2>&1 &
          for attempt in $(seq 60); do docker info > /dev/null 2>&1 && break; sleep 1; done
          docker info -f '{{ .DriverStatus }}' | grep io.containerd.snapshotter
          docker version
          docker buildx version

      - name: Log in to the registry mirror
        if: vars.REGISTRY_MIRROR != ''
        env:
          REGISTRY_MIRROR: ${{ vars.REGISTRY_MIRROR }}
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "${REGISTRY_MIRROR%%/*}"

      - name: Build the image
        env:
          REGISTRY_MIRROR: ${{ vars.REGISTRY_MIRROR }}
        run: ./build.sh 26 linux/arm64

      - name: Smoke-test the image
        run: node test/run.mjs lambda-runtime/image:nodejs26.x-mainline-arm64 linux/arm64

      - name: Security-test the image
        run: node test/run.mjs lambda-runtime/image:nodejs26.x-mainline-arm64 linux/arm64 test/security-cases.json

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push the image
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA-arm64"
          docker tag lambda-runtime/image:nodejs26.x-mainline-arm64 "$image"
          docker push "$image"
