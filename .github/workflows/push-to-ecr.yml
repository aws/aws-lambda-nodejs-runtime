name: Build and Push to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for requesting the OIDC JWT token
permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: aws-lambda-nodejs-runtime

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner-label: codebuild-project-aws-aws-lambda-nodejs-runtime-x86-${{ github.run_id }}-${{ github.run_attempt }}
          - arch: arm64
            runner-label: codebuild-project-aws-aws-lambda-nodejs-runtime-arm64-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ${{ matrix.runner-label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ARCH: ${{ matrix.arch }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}-$ARCH"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --build-arg "ARCH=$ARCH" -t "$IMAGE" .

      - name: Push image
        run: docker push "$IMAGE"
