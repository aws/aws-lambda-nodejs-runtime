# TLS profile: cnsa/1.0
# CNSA 1.0: AES-256, SHA-384 and P-384 only, no post-quantum.
# SECLEVEL=3 enforces a 128-bit floor (RSA >= 3072, P-384) to meet the claim.

# Node reads nodejs_conf, or openssl_conf with --openssl-shared-config.
openssl_conf = openssl_init
nodejs_conf = openssl_init
config_diagnostics = 1

[openssl_init]
providers = provider_sect
ssl_conf = ssl_module
alg_section = evp_properties

[evp_properties]

[provider_sect]
default = default_sect

[default_sect]
activate = 1

[ssl_module]
system_default = crypto_policy

[crypto_policy]
CipherString = @SECLEVEL=3:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
Ciphersuites = TLS_AES_256_GCM_SHA384
TLS.MinProtocol = TLSv1.2
TLS.MaxProtocol = TLSv1.3
DTLS.MinProtocol = DTLSv1.2
DTLS.MaxProtocol = DTLSv1.2
SignatureAlgorithms = ECDSA+SHA384:rsa_pss_rsae_sha384:rsa_pss_pss_sha384:RSA+SHA384
Groups = secp384r1
